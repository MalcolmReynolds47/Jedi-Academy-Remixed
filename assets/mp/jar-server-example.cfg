// Copy to your MP home profile as server.cfg, then edit the copy.
set sv_hostname "Jedi Academy Remixed Sandbox"
set sv_maxclients 16
set sv_pure 0
set sv_fps 40
set sv_maxRate 100000
set g_gametype 0
set fraglimit 0
set timelimit 0
set capturelimit 0
set jar_sandbox 1
set jar_sharedEditing 1
set jar_cleanupDisconnect 0
set jar_playerTools 1
set jar_mapActorEditing 1
// Allow building with restored objects; set 0 in your server.cfg to protect them.
set jar_worldEditing 1
// To restore at map start, put: set jar_worldLoad "slot_name" BEFORE map in server.cfg.
// Console/RCON: jar_world_save SLOT, jar_world_load SLOT, jar_world_clear,
// jar_world_status. Loading requires an empty spawned Sandbox world.
// Saves are map/BSP-specific, two checked revisions under jar/worlds in the MP home profile.
// Periodic + orderly shutdown/map-change saves, using a map/BSP-specific auto slot.
// 0 disables saves; positive intervals are clamped to 30-3600 seconds.
set jar_worldAutoSave 120
set jar_worldAutoLoad 1
// An explicit jar_worldLoad slot takes precedence over automatic map restoration.
// Inspect autosave state with jar_world_status. Failed restores block automatic
// writes until an explicit successful jar_world_load or jar_world_clear.
// Snapshot-only: held/occupied members restore parked; transient player/map-NPC
// ropes are omitted and counted. Running players/vehicles are never disturbed.
// Players can opt out through C / Block tools on me, or jar_allowTools 0.
// Set g_password and rconPassword in your private server.cfg if wanted.
// To allow cheats, put set jar_hostCheats 1 before map in your server.cfg.
// To choose a UDP port, pass +set net_port <port> to Host-JA-R-Server.cmd.
map mp/ffa3
